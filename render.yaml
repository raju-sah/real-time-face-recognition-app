services:
  - type: web
    name: neurovision-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: UPLOAD_DIR
        value: backend/uploads
      - key: OMP_NUM_THREADS
        value: "1"
