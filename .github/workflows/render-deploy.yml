name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'build.sh'
      - 'render.yaml'
      - 'requirements.txt'
      - '.python-version'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
